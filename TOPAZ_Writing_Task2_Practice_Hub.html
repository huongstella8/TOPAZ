<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPAZ · IELTS Writing Task 2 Practice Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#d76b34; --orange-soft:#e7a173; --sage:#7f9a76; --sage-soft:#c3d0bd;
    --cream:#f1efe7; --paper:#ffffff; --ink:#232321; --muted:#6f6e66;
    --line:#e7e3d7; --yellow:#e9d9a6;
    --shadow:0 1px 2px rgba(30,28,22,.04),0 6px 20px rgba(30,28,22,.06);
    --shadow-lg:0 4px 30px rgba(30,28,22,.10);
    --font-head:'Fraunces',Georgia,'Times New Roman',serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --rad:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--font-body);background:var(--cream);color:var(--ink);
    line-height:1.62;font-size:15px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  h1,h2,h3,h4{font-family:var(--font-head);line-height:1.2;margin:0;letter-spacing:-.01em;font-weight:600}
  a{color:var(--orange)}
  /* Header */
  header.top{background:radial-gradient(120% 140% at 0% 0%,#33322d 0%,#1f1e1b 55%,#191814 100%);
    color:#fff;padding:20px 30px 22px;position:relative;overflow:hidden}
  header.top::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;
    background:radial-gradient(circle,rgba(215,107,52,.28),transparent 70%);pointer-events:none}
  header.top .paradigm{font-family:var(--font-head);font-size:15px;letter-spacing:6px;font-weight:600;
    color:#fff;border-bottom:1px solid rgba(255,255,255,.16);padding-bottom:11px;margin-bottom:13px;text-transform:uppercase}
  header.top .brand{font-size:12px;letter-spacing:4px;color:var(--orange-soft);font-weight:700}
  header.top h1{font-size:33px;margin:3px 0 6px;color:#fff;font-weight:600;letter-spacing:-.02em}
  header.top p{margin:0;color:#d3d0c6;font-size:13.5px;max-width:860px;line-height:1.55}
  header.top .langswitch{position:absolute;top:20px;right:26px;display:flex;gap:0;border:1px solid rgba(255,255,255,.25);
    border-radius:20px;overflow:hidden;z-index:2}
  header.top .langswitch button{border:0;background:transparent;color:#d3d0c6;font:inherit;font-weight:700;
    font-size:12px;letter-spacing:.5px;padding:6px 13px;cursor:pointer;transition:.15s}
  header.top .langswitch button.on{background:var(--orange);color:#fff}
  /* Tabs */
  nav.tabs{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:3px;padding:9px 16px;
    box-shadow:0 2px 14px rgba(30,28,22,.05)}
  nav.tabs button{border:0;background:transparent;font:inherit;font-weight:600;color:var(--muted);
    padding:8px 15px;border-radius:10px;cursor:pointer;font-size:13.5px;transition:.15s;white-space:nowrap}
  nav.tabs button:hover{background:var(--cream);color:var(--ink)}
  nav.tabs button.active{background:var(--ink);color:#fff}
  nav.tabs button .tno{font-size:10.5px;opacity:.65;margin-right:5px;font-weight:800}
  /* Layout */
  main{max-width:1090px;margin:0 auto;padding:28px 22px 90px}
  section.view{display:none;animation:fade .25s ease}
  section.view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* Sub nav */
  .subnav{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 22px}
  .subnav button{border:1px solid var(--line);background:var(--paper);font:inherit;font-weight:600;
    font-size:13px;color:var(--muted);padding:7px 14px;border-radius:20px;cursor:pointer;transition:.15s}
  .subnav button:hover{border-color:var(--sage)}
  .subnav button.on{background:var(--sage);border-color:var(--sage);color:#fff}
  .panel{display:none}
  .panel.on{display:block}
  /* Cards */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--rad);padding:22px 24px;
    margin-bottom:18px;box-shadow:var(--shadow)}
  .card h3{font-size:21px;margin-bottom:5px;color:var(--ink)}
  .card .lead{color:var(--muted);font-size:13.5px;margin-bottom:16px;max-width:820px}
  .topichero{display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:4px 2px}
  .topichero .badge{width:60px;height:60px;border-radius:16px;
    background:linear-gradient(150deg,var(--orange),#c05a26);color:#fff;box-shadow:0 6px 16px rgba(199,90,40,.28);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:23px;font-weight:600;flex-shrink:0}
  .topichero h2{font-size:28px}
  .topichero p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
  /* Vocab */
  .vgroup{margin-bottom:18px}
  .vgroup h4{font-size:15px;color:var(--orange);border-bottom:2px solid var(--sage-soft);
    padding-bottom:5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:5px 11px;font-size:13.5px}
  .chip b{color:var(--ink)}
  .wtable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  .wtable td{border:1px solid var(--line);padding:7px 10px;vertical-align:top}
  .wtable td:first-child{font-weight:600;width:38%;background:var(--cream)}
  /* Rich vocabulary entries */
  .vsub{font-family:var(--font-head);font-size:13.5px;font-weight:600;color:#8a5a2c;display:flex;align-items:center;gap:9px;
    margin:20px 0 12px;letter-spacing:.01em}
  .vsub::before{content:"";width:22px;height:3px;background:var(--orange);border-radius:2px;display:inline-block}
  .ventry{border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px;background:var(--paper);
    box-shadow:var(--shadow);transition:transform .12s ease,box-shadow .12s ease}
  .ventry:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
  .ventry .vhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin-bottom:8px;
    padding-bottom:8px;border-bottom:1px solid var(--line)}
  .ventry .vw{font-family:var(--font-head);font-weight:700;font-size:18px;color:var(--ink);letter-spacing:-.01em}
  .ventry .pos{font-size:10.5px;font-weight:700;color:#fff;background:var(--sage);padding:2px 9px;border-radius:12px;font-style:normal;letter-spacing:.3px}
  .ventry .ipa{font-family:var(--font-body);color:var(--orange);font-size:14px;font-weight:500}
  .ventry .vspeak{margin-left:auto;border:1px solid var(--line);background:var(--cream);border-radius:8px;
    cursor:pointer;font-size:13px;padding:3px 9px;color:var(--muted)}
  .ventry .vspeak:hover{border-color:var(--orange);color:var(--orange)}
  .ventry .vdef{font-size:13.6px;margin:2px 0}
  .ventry .vdef b{color:var(--sage);font-size:11px;letter-spacing:.5px;margin-right:4px}
  .ventry .vdef.vi b{color:var(--orange)}
  .ventry .vex{font-size:13.2px;font-style:italic;color:var(--muted);margin-top:6px;
    border-left:3px solid var(--sage-soft);padding-left:10px}
  .ventry .vex b{font-style:normal;color:var(--ink)}
  .ventry .vcol{font-size:12.4px;margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;color:#5c5c54}
  .ventry .vcol b{display:block;color:var(--orange);font-size:9.5px;letter-spacing:.7px;margin-bottom:2px;font-weight:700}
  /* side-by-side vocabulary boxes */
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px;align-items:stretch}
  .vgrid .ventry{margin-bottom:0;display:flex;flex-direction:column}
  @media(max-width:640px){.vgrid{grid-template-columns:1fr}}
  /* Glossary */
  .gsearch{width:100%;padding:11px 15px;border:1px solid var(--line);border-radius:10px;font:inherit;
    font-size:14px;margin-bottom:16px;background:var(--paper)}
  .gsearch:focus{outline:none;border-color:var(--orange)}
  .gtopic{scroll-margin-top:70px}
  .gtopic h3{font-size:19px;color:var(--ink);border-bottom:2px solid var(--orange);padding-bottom:6px;margin:22px 0 4px}
  .gcount{font-size:12px;color:var(--muted);margin-bottom:6px}
  .gjump{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .gjump a{font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);border:1px solid var(--line);
    padding:4px 10px;border-radius:16px;background:var(--paper)}
  .gjump a:hover{border-color:var(--orange);color:var(--orange)}
  /* Idea development */
  .arg{border-left:4px solid var(--orange);background:var(--paper);border:1px solid var(--line);
    border-left-width:4px;border-radius:0 12px 12px 0;padding:14px 18px;margin-bottom:14px}
  .arg.against{border-left-color:var(--sage)}
  .arg .claim{font-weight:700;font-size:15px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
  .arg .tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:20px;
    color:#fff;background:var(--orange);flex-shrink:0;margin-top:2px}
  .arg.against .tag{background:var(--sage)}
  .chain{list-style:none;margin:0;padding:0;counter-reset:step}
  .chain li{position:relative;padding:4px 0 4px 30px;font-size:13.8px;counter-increment:step}
  .chain li::before{content:counter(step);position:absolute;left:0;top:4px;width:20px;height:20px;
    background:var(--cream);border:1px solid var(--sage);border-radius:50%;font-size:11px;font-weight:700;
    color:var(--sage);display:flex;align-items:center;justify-content:center}
  .chain li:not(:last-child)::after{content:"";position:absolute;left:9.5px;top:24px;bottom:-2px;width:1px;background:var(--sage-soft)}
  .themetag{display:inline-block;background:var(--yellow);color:#6b5a1f;font-size:12px;font-weight:700;
    padding:3px 10px;border-radius:6px;margin:14px 0 8px}
  /* Practice bank */
  .prompt{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  .prompt .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:7px}
  .pill{font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:20px}
  .pill.new{background:var(--orange);color:#fff}
  .pill.file{background:var(--sage);color:#fff}
  .pill.common{background:var(--cream);color:var(--muted);border:1px solid var(--line)}
  .pill.type{background:#efe7db;color:#8a6a3a}
  .prompt p{margin:0;font-size:14.5px}
  .prompt .date{font-size:11.5px;color:var(--muted);margin-left:auto}
  /* Checklist */
  .crit{margin-bottom:16px}
  .crit h4{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .crit h4 .k{background:var(--ink);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;font-family:monospace}
  .check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
  .check input{margin-top:5px;width:16px;height:16px;accent-color:var(--sage);flex-shrink:0;cursor:pointer}
  .check label{cursor:pointer}
  /* Band table */
  .bandwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  .bandsrc{font-size:11.6px;color:var(--muted);padding:9px 12px;border-top:1px solid var(--line);background:var(--paper)}
  .bandgroup{margin-bottom:20px}
  .bghead{font-family:Georgia,serif;font-weight:700;font-size:15px;padding:9px 15px;border-radius:10px 10px 0 0;color:#fff}
  .bandgroup.bg-hi .bghead{background:#4f7a41}
  .bandgroup.bg-mid .bghead{background:#a5842f}
  .bandgroup.bg-lo .bghead{background:#b25a2e}
  .bandgroup .bandwrap{border-radius:0 0 12px 12px}
  .refcard ol{margin:8px 0 0;padding-left:20px}
  .refcard li{font-size:13.4px;margin-bottom:8px}
  .refcard .tag2{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--sage);
    padding:2px 8px;border-radius:12px;margin-right:6px;letter-spacing:.4px}
  table.band{border-collapse:collapse;width:100%;min-width:760px;font-size:12.8px}
  table.band th,table.band td{border:1px solid var(--line);padding:9px 11px;vertical-align:top;text-align:left}
  table.band thead th{background:var(--ink);color:#fff;font-family:'Segoe UI',sans-serif;font-size:12.5px;position:sticky;top:0}
  table.band td.bn{font-weight:800;font-size:16px;text-align:center;font-family:Georgia,serif;width:46px}
  /* colour-coded by BAND: every criterion in one band shares the same tone (green→red) */
  table.band tr[data-b="9"] td{background:#dcebd4}
  table.band tr[data-b="8"] td{background:#e8f1de}
  table.band tr[data-b="7"] td{background:#f3f0d2}
  table.band tr[data-b="6"] td{background:#faedcc}
  table.band tr[data-b="5"] td{background:#f7e1d0}
  table.band tr[data-b="4"] td{background:#f3d7c7}
  table.band tr[data-b="9"] td.bn{background:#bcd9ae;color:#2f5626}
  table.band tr[data-b="8"] td.bn{background:#cfe3bf;color:#3a5f2b}
  table.band tr[data-b="7"] td.bn{background:#e7dfa6;color:#6f5f16}
  table.band tr[data-b="6"] td.bn{background:#f2dda6;color:#8a6716}
  table.band tr[data-b="5"] td.bn{background:#efc7ac;color:#9e5228}
  table.band tr[data-b="4"] td.bn{background:#e9b79c;color:#a8481f}
  table.band td b{color:#141414;font-weight:800}
  /* Sample essay */
  .essay{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 26px;font-size:14.5px}
  .essay h3{text-align:center;margin-bottom:16px;font-size:22px}
  .essay p{margin:0 0 13px;position:relative}
  .essay .num{position:absolute;left:-26px;color:var(--sage);font-weight:700;font-family:Georgia,serif}
  mark.hook{background:#f6ddc9;padding:1px 2px}
  mark.thesis{background:#d9e6d3;padding:1px 2px}
  mark.topic{background:#eee2c2;padding:1px 2px}
  mark.counter{background:#e3d4ea;padding:1px 2px}
  mark.refute{background:#cfe3e8;padding:1px 2px}
  mark.restate{background:#d9e6d3;padding:1px 2px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 4px;font-size:12.5px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
  /* Structure diagram */
  .flow{display:flex;flex-direction:column;gap:2px;max-width:640px;margin:8px 0}
  .flow div{color:var(--ink);padding:12px 18px;border-radius:8px;font-weight:600;font-size:14px}
  .flow .f1{background:var(--orange);color:#fff;margin-right:0}
  .flow .f2{background:var(--orange-soft);margin-left:26px}
  .flow .f3{background:var(--yellow);margin-left:52px}
  .flow .f4{background:var(--sage-soft);margin-left:78px}
  .flow .f5{background:var(--ink);color:#fff;margin-left:104px}
  .flow small{display:block;font-weight:400;font-size:12px;opacity:.9}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}.topichero h2{font-size:22px}}
  .typebox{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .typebox h4{font-size:14.5px;color:var(--orange);margin-bottom:3px}
  .typebox .ex{font-size:12.8px;color:var(--muted);font-style:italic;margin-top:6px}
  .note{background:#fff7e8;border:1px solid var(--yellow);border-radius:10px;padding:12px 15px;font-size:13px;margin-bottom:16px}
  .qanalyze{background:#ecf3e9;border:1px solid var(--sage-soft);border-radius:10px;padding:12px 16px;margin:6px 0 16px;font-size:13.4px}
  .qanalyze .row{display:flex;flex-wrap:wrap;gap:6px;padding:5px 0;border-bottom:1px dashed #cdd8c5}
  .qanalyze .row:last-child{border-bottom:0}
  .qanalyze .lbl{font-weight:700;color:#4f6446;min-width:150px;flex-shrink:0}
  .qanalyze mark{background:#f6ddc9;padding:0 3px;border-radius:3px}
  .qanalyze mark.t{background:#e3d4ea}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
  .resetbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;
    font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted);margin-bottom:10px}
  .linkbtn{border:0;background:var(--sage);color:#fff;font:inherit;font-weight:700;font-size:12.5px;
    padding:3px 10px;border-radius:7px;cursor:pointer}
  .linkbtn:hover{background:#87997f}
</style>
</head>
<body>
<header class="top">
  <div class="langswitch">
    <button id="lang-vi" class="on" onclick="setLang('vi')">VI</button>
    <button id="lang-en" onclick="setLang('en')">EN</button>
  </div>
  <div class="paradigm">HUONG STELLA PARADIGM</div>
  <div class="brand">TOPAZ · IELTS WRITING</div>
  <h1>Writing Task 2 — Practice Hub</h1>
  <p id="headIntro"></p>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

function tr(k){const o=TR[k];return o?(o[LANG]||o.vi):k;}

/* --- tabs --- */
const allTabs = [{id:OVERVIEW_ID,label:"Tổng quan",no:""}]
  .concat(topics.map(t=>({id:t.id,label:t.title,no:t.n})))
  .concat([{id:"glossary",label:"📖 Glossary",no:""},{id:"checklist",label:"✅ Checklist",no:""}]);
function renderTabs(){
  tabsEl.innerHTML='';
  allTabs.forEach(t=>{
    const b=document.createElement('button');
    const label = t.id===OVERVIEW_ID ? tr('tab.overview') : t.label;
    b.innerHTML = (t.no?`<span class="tno">${t.no}</span>`:'')+label;
    b.onclick=()=>show(t.id);
    b.id='tab-'+t.id;
    tabsEl.appendChild(b);
  });
  const active=document.getElementById('tab-'+currentView);
  if(active)active.classList.add('active');
}

function show(id){
  currentView=id;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  const tb=document.getElementById('tab-'+id); if(tb)tb.classList.add('active');
  document.querySelectorAll('section.view').forEach(v=>v.classList.remove('active'));
  const vw=document.getElementById('view-'+id); if(vw)vw.classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* --- band table + checklist (shared) --- */
function bandGroupHTML(title, bands, cls){
  const rows = bandDescriptors.filter(d=>bands.includes(d.b)).map(d=>
    `<tr data-b="${d.b}"><td class="bn">${d.b}</td>
     <td>${d.tr}</td><td>${d.cc}</td><td>${d.lr}</td><td>${d.gra}</td></tr>`).join('');
  return `<div class="bandgroup ${cls}"><div class="bghead">${title}</div>
    <div class="bandwrap"><table class="band"><thead><tr>
      <th>Band</th><th>Task Response</th><th>Coherence &amp; Cohesion</th>
      <th>Lexical Resource</th><th>Grammatical Range &amp; Accuracy</th></tr></thead>
    <tbody>${rows}</tbody></table></div></div>`;
}
function bandTableHTML(){
  return bandGroupHTML("Band 8–9 · Very good – Expert user", ["8","9"], "bg-hi")
       + bandGroupHTML("Band 6–7 · Competent – Good user", ["6","7"], "bg-mid")
       + bandGroupHTML("Band 4–5 · Limited – Modest user", ["4","5"], "bg-lo")
       + `<div class="bandsrc" style="border:1px solid var(--line);border-radius:8px">${tr('bandsrc')}</div>`;
}
function checklistHTML(topicId){
  let out = `<button class="resetbtn" onclick="resetChecks('${topicId}')">${tr('chk.reset')}</button>`;
  for(const k in checklist){
    const c=checklist[k];
    out += `<div class="crit"><h4><span class="k">${k}</span> ${c.name}</h4>`;
    c.items.forEach((it,idx)=>{
      const id=`chk-${topicId}-${k}-${idx}`;
      const label = (it&&typeof it==='object') ? (it[LANG]||it.vi) : it;
      out+=`<div class="check"><input type="checkbox" id="${id}"><label for="${id}">${label}</label></div>`;
    });
    out+=`</div>`;
  }
  out += `<div class="themetag" style="margin-top:18px">${tr('chk.bands')}</div>`;
  out += bandTableHTML();
  return out;
}
function resetChecks(topicId){
  document.querySelectorAll(`[id^="chk-${topicId}-"]`).forEach(c=>c.checked=false);
}

function buildOverview(){
  const sec=document.createElement('section');
  sec.className='view'; sec.id='view-'+OVERVIEW_ID;

  const types = essayTypes.map((t,i)=>`<div class="typebox"><h4>${t.t}</h4><div>${tr('et.d'+(i+1))}</div>
    <div class="ex">“${esc(t.ex)}”</div></div>`).join('');

  sec.innerHTML = `
  <div class="card">
    <h3>${tr('use.title')}</h3>
    <div class="lead">${tr('use.lead')}</div>
    <div class="grid2">
      <div class="typebox"><h4>1 · Vocabulary</h4><div>${tr('use.v.d')}</div></div>
      <div class="typebox"><h4>2 · Idea Development</h4><div>${tr('use.i.d')}</div></div>
      <div class="typebox"><h4>3 · Practice Bank</h4><div>${tr('use.p.d')}</div></div>
      <div class="typebox"><h4>${tr('use.c.t')}</h4><div>${tr('use.c.d')}</div></div>
    </div>
  </div>

  <div class="card">
    <h3>${tr('types.title')}</h3>
    <div class="lead">${tr('types.lead')}</div>
    <div class="grid2">${types}</div>
  </div>

  <div class="card">
    <h3>${tr('struct.title')}</h3>
    <div class="lead">${tr('struct.lead')}</div>
    <div class="flow">
      <div class="f1">${tr('flow.f1')}</div>
      <div class="f2">${tr('flow.f2')}</div>
      <div class="f3">${tr('flow.f3')}</div>
      <div class="f4">${tr('flow.f4')}</div>
      <div class="f5">${tr('flow.f5')}</div>
    </div>
    <div class="note">${tr('note.intro')}</div>
    <div class="note">${tr('note.counter')}</div>
  </div>

  <div class="card">
    <h3>${tr('sample.title')}</h3>
    <div class="lead">${tr('sample.lead')}</div>

    <div class="prompt" style="border-left:4px solid var(--orange)">
      <div class="meta">
        <span class="pill type">Opinion · Agree/Disagree</span>
        <span class="pill common">${tr('sample.tag')}</span>
      </div>
      <p><b>Some people believe that all school students should be required to wear a uniform. To what extent do you agree or disagree?</b></p>
    </div>

    <div class="themetag">${tr('analyze.title')}</div>
    <div class="qanalyze">
      <div class="row"><span class="lbl">${tr('an.key.l')}</span><span>${tr('an.key.v')}</span></div>
      <div class="row"><span class="lbl">${tr('an.task.l')}</span><span>${tr('an.task.v')}</span></div>
      <div class="row"><span class="lbl">${tr('an.type.l')}</span><span>${tr('an.type.v')}</span></div>
      <div class="row"><span class="lbl">${tr('an.stance.l')}</span><span>${tr('an.stance.v')}</span></div>
    </div>

    <div class="legend">
      <span><i style="background:#f6ddc9"></i>Hook</span>
      <span><i style="background:#d9e6d3"></i>Thesis / Restated thesis</span>
      <span><i style="background:#eee2c2"></i>${tr('legend.topic')}</span>
      <span><i style="background:#e3d4ea"></i>Counterargument</span>
      <span><i style="background:#cfe3e8"></i>Refutation</span>
    </div>
    <div class="essay">
      <h3>The School Uniform Question</h3>
      <p><span class="num">1</span><mark class="hook">Individualism is a fundamental part of society in many countries. Most people believe in the right to express their own opinion without fear of punishment.</mark> This value, however, is coming under fire in an unlikely place—the public school classroom. The issue is school uniforms. Should public school students be allowed to make individual decisions about clothing, or should all students be required to wear a uniform? <mark class="thesis">School uniforms are the better choice for three reasons.</mark></p>
      <p><span class="num">2</span><mark class="topic">First, wearing school uniforms would help make students' lives simpler.</mark> They would no longer have to decide what to wear every morning, sometimes trying on outfit after outfit in an effort to choose. Uniforms would not only save time but also would eliminate the stress often associated with this chore.</p>
      <p><span class="num">3</span><mark class="topic">Second, school uniforms influence students to act responsibly in groups and as individuals.</mark> Uniforms give students the message that school is a special place for learning. In addition, uniforms create a feeling of unity among students. For example, when students do something as a group, the fact that they all wear the same uniform gives them a sense of community. Even more important, statistics show the positive effects on violence and truancy. According to a recent survey in a large school district in Florida, incidents of school violence dropped by 50 percent, attendance and test scores improved, and suspensions declined approximately 30 percent after uniforms were introduced.</p>
      <p><span class="num">4</span><mark class="topic">Finally, school uniforms would help make all the students feel equal.</mark> Students' standards of living differ greatly from family to family, and some people are well-off while others are not. People sometimes forget that school is a place to get an education, not to promote a "fashion show." Implementing mandatory uniforms would make all students look the same regardless of their financial status, promoting pride and raising the self-esteem of students who cannot afford expensive clothing.</p>
      <p><span class="num">5</span><mark class="counter">Opponents of mandatory uniforms say that students who wear school uniforms cannot express their individuality. This point has some merit on the surface.</mark> <mark class="refute">However, as stated previously, school is a place to learn, not to flaunt wealth and fashion.</mark> Society must decide if individual expression through clothing is more valuable than improved educational performance. It is important to remember that school uniforms would be worn only during school hours. Students can express their individuality in the way they dress outside of the classroom.</p>
      <p><span class="num">6</span>In conclusion, there are many well-documented benefits of implementing mandatory school uniforms for students. <mark class="restate">Studies show that students learn better and act more responsibly when they wear uniforms. Public schools should require uniforms in order to benefit both the students and society as a whole.</mark></p>
    </div>
  </div>

  <div class="card refcard">
    <h3>${tr('refs.title')}</h3>
    <div class="lead">${tr('refs.lead')}</div>

    </ol>

}

function entryHTML(e){
  const wsafe = e.w.replace(/'/g,"\\'");
  const col = COLLOC[e.w];
  return `<div class="ventry">
    <div class="vhead"><span class="vw">${esc(e.w)}</span>
      <span class="pos">${esc(e.pos)}</span>
      <span class="ipa">${esc(e.ipa)}</span>
      <button class="vspeak" title="${tr('speak.title')}" onclick="speak('${wsafe}')">🔊</button></div>
    <div class="vdef"><b>EN</b>${esc(e.en)}</div>
    ${LANG==='vi'?`<div class="vdef vi"><b>VN</b>${esc(e.vi)}</div>`:''}
    <div class="vex">e.g. ${EX7[e.w]||e.ex}</div>
    ${col?`<div class="vcol"><b>COLLOCATIONS</b>${esc(col)}</div>`:''}</div>`;
}
function richVocabHTML(id){
  const t=VOCAB[id]; if(!t) return '';
  return t.groups.map(g=>`<div class="vsub">${esc(g.sub)}</div>`+
    `<div class="vgrid">`+g.words.map(entryHTML).join('')+`</div>`).join('');
}
let _gbVoice=null;
function pickGBVoice(){
  const vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
  // prefer named British voices, then any en-GB voice
  const pref=["Google UK English Female","Google UK English Male","Daniel","Kate","Serena","Arthur","Sonia","Libby","George"];
  for(const name of pref){const v=vs.find(x=>x.name===name);if(v)return v;}
  return vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/English \(United Kingdom\)/i.test(v.name)) || null;
}
if('speechSynthesis' in window){
  _gbVoice=pickGBVoice();
  speechSynthesis.onvoiceschanged=()=>{_gbVoice=pickGBVoice();};
}
function speak(w){
  try{ if(!('speechSynthesis' in window))return;
    const u=new SpeechSynthesisUtterance(w);
    u.lang='en-GB'; u.rate=.9;
    if(!_gbVoice)_gbVoice=pickGBVoice();
    if(_gbVoice)u.voice=_gbVoice;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

function ideaHTML(node){

  const tag = node.side==='against'?tr('idea.tag.counter'):tr('idea.tag.arg');
  return `<div class="${cls}"><div class="claim"><span class="tag">${tag}</span><span>${esc(node.claim)}</span></div>
    <ul class="chain">${node.chain.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
}

function practiceHTML(p){
  const pillClass = p.tag==='new'?'new':(p.tag==='file'?'file':'common');
  const pillTxt = p.tag==='new'?tr('pill.new'):(p.tag==='file'?tr('pill.file'):tr('pill.common'));
  return `<div class="prompt"><div class="meta">
    <span class="pill ${pillClass}">${pillTxt}</span>
    <span class="pill type">${esc(p.type)}</span>
    ${p.tag==='new'?`<span class="date">${tr('pill.source')}</span>`:(p.date?`<span class="date">${esc(p.date)}</span>`:'')}
    </div><p>${esc(p.text)}</p></div>`;
}

/* --- topic view --- */
function buildTopic(t){
  const sec=document.createElement('section');
  sec.className='view'; sec.id='view-'+t.id;

  const vocab = richVocabHTML(t.id);
  const ideas = t.ideas.map(ideaHTML).join('');
  const prac = t.practice.map(practiceHTML).join('');

  sec.innerHTML = `
    <div class="topichero">
      <div class="badge">${t.n}</div>
      <div><h2>${t.title}</h2><p>${t.sub}</p></div>
    </div>
    <div class="subnav" id="sub-${t.id}">
      <button class="on" data-p="voc">📘 Vocabulary</button>
      <button data-p="idea">💡 Idea Development</button>
      <button data-p="prac">✍️ Practice Bank</button>
    </div>
    <div class="panel on" id="p-${t.id}-voc"><div class="card">
      <h3>${tr('vocab.h')}</h3>${vocab}</div></div>
    <div class="panel" id="p-${t.id}-idea"><div class="card">
      <h3>${tr('idea.h')}</h3><div class="lead">${tr('idea.lead')}</div>${ideas}</div></div>
    <div class="panel" id="p-${t.id}-prac"><div class="card">
      <h3>${tr('prac.h')}</h3><div class="lead">${tr('topic.prac.lead')}</div>${prac}
      <div class="note" style="margin:14px 0 0">${tr('topic.prac.reminder')}</div></div></div>
  `;
  mainEl.appendChild(sec);

  // sub-nav behaviour
  const nav=sec.querySelector('#sub-'+t.id);
  nav.querySelectorAll('button').forEach(btn=>{
    btn.onclick=()=>{
      nav.querySelectorAll('button').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      sec.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
      sec.querySelector('#p-'+t.id+'-'+btn.dataset.p).classList.add('on');
    };
  });
}

/* --- glossary view --- */
function buildGlossary(){
  const sec=document.createElement('section');
  sec.className='view'; sec.id='view-glossary';
  let total=0;
  topics.forEach(t=>{const v=VOCAB[t.id]; if(v) v.groups.forEach(g=>total+=g.words.length);});
  const jump = topics.map(t=>`<a href="#g-${t.id}">${t.n} · ${t.title}</a>`).join('');
  const body = topics.map(t=>{
    const v=VOCAB[t.id]; if(!v) return '';
    const cnt=v.groups.reduce((s,g)=>s+g.words.length,0);
    const groups=v.groups.map(g=>
      `<div class="ggroup"><div class="vsub">${esc(g.sub)}</div><div class="vgrid">${g.words.map(entryHTML).join('')}</div></div>`).join('');
    return `<div class="gtopic" id="g-${t.id}"><h3>${t.n} · ${t.title}</h3>
      <div class="gcount">${cnt} ${tr('glos.count')}</div>${groups}</div>`;
  }).join('');
  sec.innerHTML = `<div class="card">
    <h3>${tr('glos.title')}</h3>
    <div class="lead">${tr('glos.lead1')}${total}${tr('glos.lead2')}</div>
    <input class="gsearch" id="gsearch" placeholder="${tr('glos.ph')}" oninput="filterGlossary(this.value)">
    <div class="gjump">${jump}</div>
    <div id="gbody">${body}</div></div>`;
  mainEl.appendChild(sec);
}
function filterGlossary(q){
  q=(q||'').toLowerCase().trim();
  document.querySelectorAll('#gbody .ventry').forEach(el=>{
    el.style.display = (!q || el.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('#gbody .ggroup').forEach(gr=>{
    const any=[...gr.querySelectorAll('.ventry')].some(e=>e.style.display!=='none');
    gr.style.display=any?'':'none';
  });
  document.querySelectorAll('#gbody .gtopic').forEach(tp=>{
    const any=[...tp.querySelectorAll('.ventry')].some(e=>e.style.display!=='none');
    tp.style.display=any?'':'none';
  });
}

/* --- checklist view (dedicated tab) --- */
function buildChecklist(){
  const sec=document.createElement('section');
  sec.className='view'; sec.id='view-checklist';
  sec.innerHTML=`<div class="card">
    <h3>${tr('cl.title')}</h3>
    <div class="lead">${tr('cl.lead')}</div>
    ${checklistHTML('main')}
  </div>`;
  mainEl.appendChild(sec);
}

/* build all */
function renderMain(){
  mainEl.innerHTML='';
  buildOverview();
  topics.forEach(buildTopic);
  buildGlossary();
  buildChecklist();
  const vw=document.getElementById('view-'+currentView);
  if(vw){vw.classList.add('active');}
  else{currentView=OVERVIEW_ID;document.getElementById('view-'+OVERVIEW_ID).classList.add('active');}
}
function setLang(l){
  LANG=l;
  document.documentElement.lang=l;
  const bvi=document.getElementById('lang-vi'), ben=document.getElementById('lang-en');
  if(bvi)bvi.classList.toggle('on',l==='vi');
  if(ben)ben.classList.toggle('on',l==='en');
  const hi=document.getElementById('headIntro'); if(hi)hi.innerHTML=tr('head.intro');
  const ft=document.getElementById('foot'); if(ft)ft.innerHTML=tr('foot');
  renderTabs();
  renderMain();
  show(currentView);
}
setLang('vi');
